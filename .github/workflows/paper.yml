# Paper trading on real market data — zero secrets, zero real-money orders.
#
# - PaperPort uses only public Delta market data endpoints (no API keys needed)
#   and simulates fills locally; it can never send an order.
# - Strategy A (rwa_positional) and B (all_in_one) run as separate matrix jobs:
#   separate simulated accounts, journals under paper/<strategy>/, separate PnL.
# - Each run: bounded trading session (default 25 min per strategy) → combined
#   PnL calendar + daily stats report (paper/REPORT.md) → commit journal/state
#   back so accounts, open positions and campaigns survive across runs.
# - The README headline table between <!-- paper:start/end --> markers is
#   auto-updated each run.
name: paper-trading

on:
  schedule:
    # every 4 hours (two ~25 min sessions + report/commit, inside one slot)
    - cron: "25 4,8,12,16,20,0 * * *"
  workflow_dispatch:
    inputs:
      strategies:
        description: "Strategies to paper-trade"
        default: "rwa_positional,all_in_one"
        required: false
      minutes:
        description: "Session length in minutes (per strategy)"
        default: "25"
      initial_equity:
        description: "Initial equity override (USD, first run only)"
        default: ""

permissions:
  contents: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        strategy:
          - rwa_positional   # strategy A
          - all_in_one       # strategy B
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # allow pull --rebase before pushing updates

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Run paper session (A/B)
        run: |
          MINUTES="${{ inputs.minutes || '25' }}"
          EQ="${{ inputs.initial_equity }}"
          ARGS="--config config.yaml --strategy ${{ matrix.strategy }} --minutes $MINUTES --out-dir paper"
          if [ -n "$EQ" ]; then ARGS="$ARGS --initial-equity $EQ"; fi
          PYTHONPATH=src python -m tools.paper_session $ARGS
        # Session errors (network flakes, etc.) happen inside a try/except and
        # exit 0 with whatever was journaled; only hard bootstrap failures fail.

      - name: Generate combined PnL report (A + B)
        if: matrix.strategy == 'all_in_one'  # after the other leg's commit lands
        run: |
          sleep 20  # small grace for the sibling leg's push
          git pull --rebase origin "$GITHUB_REF_NAME"
          PYTHONPATH=src python -m tools.paper_report --out-dir paper --readme README.md

      - name: Commit journal + report
        run: |
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper README.md
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "paper(${{ matrix.strategy }}): session update $(date -u +%FT%TZ) [skip ci]"
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            git push
          fi
